name: Feature request
description: Suggest an improvement to the managed-workspace flow.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which daily workflow is currently difficult or repetitive?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible behavior, not only a technical solution.
    validations:
      required: true
